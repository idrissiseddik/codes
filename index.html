<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Assistant Balance</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body{
    background:linear-gradient(135deg,#198754,#20c997);
    padding-bottom:70px;
}
.menu-btn{
    height:65px;
    font-size:18px;
    border-radius:15px;
}
.offcanvas{
    height:100vh !important;
}
.table th{
    background:#198754;
    color:white;
}
footer{
    position:fixed;
    bottom:0;
    width:100%;
    background:#000;
    color:#fff;
    text-align:center;
    padding:10px;
    font-size:14px;
}
/* Style pour l'écran de chargement */
.loading-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    flex-direction: column;
    display: none;
}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner-border text-light mb-2" role="status"></div>
    <h5>Chargement... veuillez patienter</h5>
</div>

<div class="container py-5 text-center">

<h2 class="text-white mb-4">
<i class="fa-solid fa-apple-whole"></i>
Mon Assistant Balance
</h2>

<div class="row g-3">

<div class="col-md-6 d-grid">
<button class="btn btn-light menu-btn" data-bs-toggle="offcanvas" data-bs-target="#addCanvas">
<i class="fa fa-plus me-2"></i> Ajouter
</button>
</div>

<div class="col-md-6 d-grid">
<button class="btn btn-warning menu-btn" data-bs-toggle="offcanvas" data-bs-target="#searchCanvas">
<i class="fa fa-search me-2"></i> Rechercher
</button>
</div>

<div class="col-md-6 d-grid">
<button class="btn btn-primary menu-btn" data-bs-toggle="offcanvas" data-bs-target="#editCanvas">
<i class="fa fa-edit me-2"></i> Modifier
</button>
</div>

<div class="col-md-6 d-grid">
<button class="btn btn-danger menu-btn" data-bs-toggle="offcanvas" data-bs-target="#deleteCanvas">
<i class="fa fa-trash me-2"></i> Supprimer
</button>
</div>

<div class="col-md-6 d-grid">
<button class="btn btn-dark menu-btn" data-bs-toggle="offcanvas" data-bs-target="#allCanvas" onclick="afficherTous()">
<i class="fa fa-list me-2"></i> Afficher Tous
</button>
</div>

<div class="col-md-6 d-grid">
<button class="btn btn-secondary menu-btn" onclick="ouvrirAdmin()">
<i class="fa fa-user-shield me-2"></i> Admin
</button>
</div>

</div>
</div>

<footer>
Créé par : <strong>M.Seddik Elidrissi</strong>
</footer>

<div class="offcanvas offcanvas-top" id="addCanvas">
<div class="offcanvas-header bg-success text-white">
<h5>Ajouter Article</h5>
<button class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
</div>
<div class="offcanvas-body">
<input type="text" id="designation" class="form-control mb-3" placeholder="Désignation">
<input type="text" id="code" class="form-control mb-3" placeholder="Code Balance">
<button class="btn btn-success" onclick="ajouterArticle()">Enregistrer</button>
</div>
</div>

<div class="offcanvas offcanvas-top" id="searchCanvas">
<div class="offcanvas-header bg-warning">
<h5>Rechercher</h5>
<button class="btn-close" data-bs-dismiss="offcanvas"></button>
</div>
<div class="offcanvas-body">
<input type="text" id="searchInput" class="form-control mb-3" onkeyup="rechercher()" placeholder="Tapez la désignation...">
<div id="searchResult"></div>
</div>
</div>

<div class="offcanvas offcanvas-top" id="editCanvas">
<div class="offcanvas-header bg-primary text-white">
<h5>Modifier Article</h5>
<button class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
</div>
<div class="offcanvas-body">

<input type="text" id="editSearch" class="form-control mb-3" placeholder="Chercher par désignation exacte">
<button class="btn btn-primary mb-3" onclick="chercherArticleModifier()">Rechercher</button>

<div id="editZone" style="display:none;">
<input type="text" id="newDes" class="form-control mb-2">
<input type="text" id="newCode" class="form-control mb-2">
<button class="btn btn-success" onclick="validerModification()">Valider Modification</button>
</div>

</div>
</div>

<div class="offcanvas offcanvas-top" id="deleteCanvas">
<div class="offcanvas-header bg-danger text-white">
<h5>Supprimer Article</h5>
<button class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
</div>
<div class="offcanvas-body">

<input type="text" id="deleteSearch" class="form-control mb-3" placeholder="Chercher par désignation exacte">
<button class="btn btn-danger mb-3" onclick="chercherArticleSupprimer()">Rechercher</button>

<div id="deleteZone" style="display:none;">
<div class="alert alert-warning" id="deleteInfo"></div>
<button class="btn btn-danger" onclick="confirmerSuppression()">Confirmer Suppression</button>
</div>

</div>
</div>

<div class="offcanvas offcanvas-top" id="allCanvas">
<div class="offcanvas-header bg-dark text-white">
<h5>Liste des Articles</h5>
<button class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
</div>
<div class="offcanvas-body">
<div class="table-responsive">
<table class="table table-bordered text-center">
<thead>
<tr><th>Désignation</th><th>Code</th></tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</div>
</div>

<div class="offcanvas offcanvas-top" id="adminCanvas">
<div class="offcanvas-header bg-secondary text-white">
<h5>Espace Administrateur</h5>
<button class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
</div>
<div class="offcanvas-body text-center">

<button class="btn btn-success m-2" onclick="exportJSON()">
<i class="fa fa-download"></i> Exporter JSON depuis Sheet
</button>

<input type="file" id="importFile" class="form-control my-3">

<button class="btn btn-primary" onclick="importJSON()">
<i class="fa fa-upload"></i> Remplacer Sheet par JSON
</button>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// IMPORTANT : Mettez ici votre URL Google Apps Script officielle
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEU3ETK7gEvdfHmNbkDsmloVkYTXmeb4-pe2FUsmzrWb_-Izi_iS9q3gN_ys7L1aqV/exec";

let articles = [];
let originalDesignationTemp = null; 

function showLoading(show) {
    document.getElementById("loadingOverlay").style.display = show ? "flex" : "none";
}

async function loadArticles() {
    try {
        const response = await fetch(SCRIPT_URL);
        articles = await response.json();
    } catch (error) {
        console.error("Erreur de chargement :", error);
        Swal.fire("Erreur", "Impossible de synchroniser avec le serveur", "error");
    }
}

function resetAddFields() {
    document.getElementById("designation").value = "";
    document.getElementById("code").value = "";
}

function resetSearchFields() {
    document.getElementById("searchInput").value = "";
    document.getElementById("searchResult").innerHTML = "";
}

function resetEditFields() {
    document.getElementById("editSearch").value = "";
    document.getElementById("newDes").value = "";
    document.getElementById("newCode").value = "";
    document.getElementById("editZone").style.display = "none";
    originalDesignationTemp = null;
}

function resetDeleteFields() {
    document.getElementById("deleteSearch").value = "";
    document.getElementById("deleteInfo").innerHTML = "";
    document.getElementById("deleteZone").style.display = "none";
    originalDesignationTemp = null;
}

async function ajouterArticle(){
    let d = document.getElementById("designation").value.trim();
    let c = document.getElementById("code").value.trim();
    if(!d || !c){ Swal.fire("Erreur","Champs obligatoires","error"); return;}
    
    // --- VÉRIFICATION DES DOUBLONS ---
    // 1. On vérifie si la désignation existe déjà (insensible à la casse)
    let designationExiste = articles.some(a => a.designation.toLowerCase() === d.toLowerCase());
    if(designationExiste) {
        Swal.fire("Doublon détecté", `L'article "${d}" existe déjà dans la base.`, "warning");
        return;
    }

    // 2. On vérifie si le code balance existe déjà 
    let codeExiste = articles.find(a => a.code.toString() === c);
    if(codeExiste) {
        Swal.fire("Code déjà attribué", `Le code "${c}" est déjà utilisé par l'article : "${codeExiste.designation}".`, "warning");
        return;
    }
    // ----------------------------------

    showLoading(true);
    try {
        const res = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "add", designation: d, code: c })
        });
        const result = await res.json();
        
        if(result.status === "success") {
            await loadArticles();
            Swal.fire("Succès","Article ajouté dans le cloud","success").then(() => {
                resetAddFields();
                let offcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('addCanvas'));
                if(offcanvas) offcanvas.hide();
            });
        }
    } catch (error) {
        Swal.fire("Erreur", "Sauvegarde échouée", "error");
    } finally {
        showLoading(false);
    }
}

function rechercher(){
    let val = document.getElementById("searchInput").value.toLowerCase();
    if(val === "") {
        document.getElementById("searchResult").innerHTML = "";
        return;
    }
    let result = "";
    articles.forEach(a => {
        if(a.designation.toLowerCase().includes(val)){
            result += `<div class="alert alert-success">${a.designation} - ${a.code}</div>`;
        }
    });
    document.getElementById("searchResult").innerHTML = result || "<div class='alert alert-warning'>Aucun résultat</div>";
}

function chercherArticleModifier(){
    let val = document.getElementById("editSearch").value.toLowerCase().trim();
    if(!val) { Swal.fire("Erreur","Veuillez saisir une désignation","error"); return; }
    
    let art = articles.find(a => a.designation.toLowerCase() === val);
    if(art){
        document.getElementById("editZone").style.display = "block";
        document.getElementById("newDes").value = art.designation;
        document.getElementById("newCode").value = art.code;
        originalDesignationTemp = art.designation;
    } else {
        Swal.fire("Article introuvable","","error");
    }
}

async function validerModification(){
    if(!originalDesignationTemp) return;
    let newDes = document.getElementById("newDes").value.trim();
    let newCode = document.getElementById("newCode").value.trim();
    if(!newDes || !newCode) { Swal.fire("Erreur","Tous les champs sont obligatoires","error"); return; }
    
    // --- VÉRIFICATION DES DOUBLONS LORS DE LA MODIFICATION ---
    // On vérifie les doublons uniquement si les valeurs ont changé par rapport à l'état initial
    if(newDes.toLowerCase() !== originalDesignationTemp.toLowerCase()) {
        let designationExiste = articles.some(a => a.designation.toLowerCase() === newDes.toLowerCase());
        if(designationExiste) {
            Swal.fire("Doublon détecté", `La désignation "${newDes}" existe déjà.`, "warning");
            return;
        }
    }

    let articleActuel = articles.find(a => a.designation.toLowerCase() === originalDesignationTemp.toLowerCase());
    if(articleActuel && newCode !== articleActuel.code) {
        let codeExiste = articles.find(a => a.code.toString() === newCode);
        if(codeExiste) {
            Swal.fire("Code déjà attribué", `Le code "${newCode}" est déjà utilisé par l'article : "${codeExiste.designation}".`, "warning");
            return;
        }
    }
    // ---------------------------------------------------------

    showLoading(true);
    try {
        const res = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ 
                action: "update", 
                oldDesignation: originalDesignationTemp, 
                newDesignation: newDes, 
                newCode: newCode 
            })
        });
        const result = await res.json();
        if(result.status === "success") {
            await loadArticles();
            Swal.fire("Modification réussie","","success").then(() => {
                resetEditFields();
                let offcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('editCanvas'));
                if(offcanvas) offcanvas.hide();
            });
        }
    } catch(e) {
        Swal.fire("Erreur lors de la modification","","error");
    } finally {
        showLoading(false);
    }
}

function chercherArticleSupprimer(){
    let val = document.getElementById("deleteSearch").value.toLowerCase().trim();
    if(!val) { Swal.fire("Erreur","Veuillez saisir une désignation","error"); return; }
    
    let art = articles.find(a => a.designation.toLowerCase() === val);
    if(art){
        document.getElementById("deleteZone").style.display = "block";
        document.getElementById("deleteInfo").innerHTML = `<strong>${art.designation}</strong> - Code : ${art.code}`;
        originalDesignationTemp = art.designation;
    } else {
        Swal.fire("Article introuvable","","error");
    }
}

async function confirmerSuppression(){
    if(!originalDesignationTemp) return;
    
    showLoading(true);
    try {
        const res = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "delete", designation: originalDesignationTemp })
        });
        const result = await res.json();
        if(result.status === "success") {
            await loadArticles();
            Swal.fire("Article supprimé","","success").then(() => {
                resetDeleteFields();
                let offcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('deleteCanvas'));
                if(offcanvas) offcanvas.hide();
            });
        }
    } catch(e) {
        Swal.fire("Erreur lors de la suppression","","error");
    } finally {
        showLoading(false);
    }
}

async function afficherTous(){
    showLoading(true);
    await loadArticles();
    showLoading(false);
    
    let table = "";
    if(articles.length === 0) {
        table = "<tr><td colspan='2' class='text-center'>Aucun article</td></tr>";
    } else {
        articles.forEach(a => {
            table += `<tr><td>${a.designation}</td><td>${a.code}</td></tr>`;
        });
    }
    document.getElementById("tableBody").innerHTML = table;
}

function ouvrirAdmin(){
    Swal.fire({
        title: "Mot de passe Admin",
        input: "password",
        showCancelButton: true
    }).then(result => {
        if(result.value === "Seddik"){
            let admin = new bootstrap.Offcanvas(document.getElementById('adminCanvas'));
            admin.show();
        } else if(result.value){
            Swal.fire("Accès refusé", "", "error");
        }
    });
}

function exportJSON(){
    if(articles.length === 0){ Swal.fire("Aucune donnée disponible", "", "warning"); return;}
    let blob = new Blob([JSON.stringify(articles, null, 2)], {type: "application/json"});
    let url = URL.createObjectURL(blob);
    let a = document.createElement("a");
    a.href = url;
    a.download = "articles_cloud_backup.json";
    a.click();
    URL.revokeObjectURL(url);
    Swal.fire("Export réussi", "Téléchargé depuis la base synchronisée", "success");
}

function importJSON(){
    let file = document.getElementById("importFile").files[0];
    if(!file){ Swal.fire("Choisir un fichier", "", "warning"); return;}
    let reader = new FileReader();
    reader.onload = function(e){
        try {
            let importedArticles = JSON.parse(e.target.result);
            
            Swal.fire({
                title: "Confirmer l'import ?",
                text: "Cela remplacera TOUTES les données actuelles de votre Google Sheet.",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Oui, écraser",
                cancelButtonText: "Annuler"
            }).then(async (res) => {
                if(res.isConfirmed) {
                    showLoading(true);
                    const response = await fetch(SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "importAll", articles: importedArticles })
                    });
                    const result = await response.json();
                    if(result.status === "success") {
                        await loadArticles();
                        Swal.fire("Import Cloud réussi !", "", "success").then(() => {
                            document.getElementById("importFile").value = "";
                        });
                    }
                    showLoading(false);
                }
            });
        } catch { 
            Swal.fire("Fichier invalide", "", "error"); 
        }
    };
    reader.readAsText(file);
}

document.addEventListener('DOMContentLoaded', function() {
    loadArticles();

    document.getElementById('addCanvas').addEventListener('hidden.bs.offcanvas', resetAddFields);
    document.getElementById('searchCanvas').addEventListener('hidden.bs.offcanvas', resetSearchFields);
    document.getElementById('editCanvas').addEventListener('hidden.bs.offcanvas', resetEditFields);
    document.getElementById('deleteCanvas').addEventListener('hidden.bs.offcanvas', resetDeleteFields);
    document.getElementById('allCanvas').addEventListener('hidden.bs.offcanvas', () => {
        document.getElementById("tableBody").innerHTML = "";
    });
    document.getElementById('adminCanvas').addEventListener('hidden.bs.offcanvas', () => {
        document.getElementById("importFile").value = "";
    });
});
</script>
</body>
</html>
